<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2247"/>
      <stop offset="1" stop-color="#1d4f91"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- split window -->
  <rect x="32" y="62" width="192" height="132" rx="16" fill="#0a1a38" fill-opacity=".55" stroke="#7cc4ff" stroke-width="7"/>
  <line x1="120" y1="62" x2="120" y2="194" stroke="#7cc4ff" stroke-width="7"/>
  <!-- source pane: heading + text lines -->
  <g stroke-linecap="round" stroke-width="9" fill="none">
    <line x1="48" y1="90" x2="92" y2="90" stroke="#ffffff"/>
    <line x1="48" y1="114" x2="104" y2="114" stroke="#7cc4ff" stroke-opacity=".75"/>
    <line x1="48" y1="134" x2="96" y2="134" stroke="#7cc4ff" stroke-opacity=".75"/>
    <line x1="48" y1="154" x2="104" y2="154" stroke="#7cc4ff" stroke-opacity=".75"/>
    <line x1="48" y1="174" x2="80" y2="174" stroke="#7cc4ff" stroke-opacity=".75"/>
  </g>
  <!-- preview pane: globe -->
  <g stroke="#7cc4ff" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="172" cy="128" r="32"/>
    <ellipse cx="172" cy="128" rx="13" ry="32"/>
    <line x1="140" y1="128" x2="204" y2="128"/>
  </g>
</svg>
